[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# If Railway still uses Railpack, see railpack.json and start.sh at repo root.

[deploy]
healthcheckPath = "/api/auth/setup/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Do not set startCommand — the Dockerfile ENTRYPOINT runs migrate, then CMD starts gunicorn.
# (A custom startCommand pointed at scripts/ not in the image and caused 502 Bad Gateway.)

releaseCommand = "cd backend && python manage.py migrate --noinput"
