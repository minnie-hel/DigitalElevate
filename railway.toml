[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# If Railway still uses Railpack, see railpack.json and start.sh at repo root.

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "bash scripts/railway-start.sh"

# Runs in service root; use railpack/Docker entrypoint migrate when using Dockerfile.
releaseCommand = "bash scripts/railway-release.sh"
